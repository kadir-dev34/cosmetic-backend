name: Gece Kozmetik Scraper
on:
  schedule:
    # Her gece Türkiye saatiyle 03:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    # concurrency BURADA (job seviyesinde) olmali - workflow'un en
    # ustunde "matrix" context'i mevcut degildir, sadece job icinde
    # gecerlidir. Onceki versiyonda bu yuzden workflow tamamen
    # gecersiz sayilip 1 saniyede "Failure" ile hic baslamadan
    # basarisiz oluyordu.
    #
    # Ayni magaza icin onceki bir calistirma hala suruyorsa (orn. elle
    # tetikleme ile gecenin cron'u cakisirsa), yeni baslayani
    # kuyruga almak yerine oncekini iptal ediyoruz; aksi halde iki
    # paralel job ayni magaza icin Supabase'e ayni anda yazabilir.
    concurrency:
      group: kozmetik-scraper-${{ matrix.store }}
      cancel-in-progress: true
    # fail-fast: false -> bir magaza hata verirse/donerse digerleri
    # etkilenmez, hepsi bagimsiz calismaya devam eder.
    strategy:
      fail-fast: false
      matrix:
        store: [gratis, kozmela, boyner, sephora]
    # Her magaza icin ust sinir. scraper.py icindeki MAX_STORE_RUNTIME_SECONDS
    # (asagida 45 dk olarak ayarli) normalde bu sureden cok once biter;
    # buradaki 60 dk, sadece kurulum + olasi beklenmeyen takilmalar icin
    # bir tampon/guvenlik agi. Ikisi birbirinden bagimsiz calismamali -
    # asagidaki deger degistirilirse buradaki de guncellenmeli.
    timeout-minutes: 60
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4 python-dotenv supabase playwright
      - name: Playwright Tarayicisini Kur (sadece Kozmela/Boyner icin)
        # Kozmela ve Boyner'da urun linki sayisinin (528->3, 220->0)
        # aciklanamayan sekilde cokmesi, bu sitelerin urun linklerini
        # JavaScript ile sonradan render ediyor olabilecegini dusundurdu.
        # scraper.py bu iki magaza icin artik gercek bir Chromium
        # tarayici (Playwright) kullaniyor; bu adim o tarayicinin
        # ikili (binary) dosyasini indirir. pip ile kurulan "playwright"
        # paketi sadece Python arayuzudur, tarayicinin kendisini
        # icermez - bu adim olmadan Playwright cagrilari RuntimeError
        # ile patlar.
        #
        # Gratis ve Sephora bunu kullanmiyor (Sephora icin ayri, daha
        # riskli bir konu; Gratis'e zaten gerek yok), bu yuzden CI
        # dakikasini bosa harcamamak icin sadece bu iki magazada
        # calistiriyoruz.
        if: matrix.store == 'kozmela' || matrix.store == 'boyner'
        run: playwright install --with-deps chromium
      - name: Botu Calistir (${{ matrix.store }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # scraper.py bu sureyi (saniye) asarsa kalan urunleri atlayip
          # mevcut sonuclarla temiz sekilde biter. timeout-minutes'in
          # (60 dk = 3600s) altinda kalacak sekilde tampon birakildi.
          MAX_STORE_RUNTIME_SECONDS: '2700'
        run: python scraper.py ${{ matrix.store }}
