name: Gece Kozmetik Scraper
on:
  schedule:
    # Her gece Türkiye saatiyle 03:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    # fail-fast: false -> bir magaza hata verirse/donerse digerleri
    # etkilenmez, hepsi bagimsiz calismaya devam eder.
    strategy:
      fail-fast: false
      matrix:
        store: [gratis, kozmela, boyner, sephora]
    # Her magaza icin ust sinir - buyuk kataloglu bir magaza bile
    # bu sureyi asmamali, guvenlik amacli.
    timeout-minutes: 180
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4 python-dotenv supabase
      - name: Botu Calistir (${{ matrix.store }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scraper.py ${{ matrix.store }}
