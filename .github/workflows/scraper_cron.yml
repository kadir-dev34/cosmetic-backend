name: Gece Kozmetik Scraper
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    concurrency:
      group: kozmetik-scraper-${{ matrix.store }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        store: [gratis, kozmela, boyner, sephora]
    timeout-minutes: 60
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4 python-dotenv supabase playwright
      - name: Playwright Tarayicisini Kur
        if: matrix.store == 'kozmela' || matrix.store == 'boyner'
        run: playwright install --with-deps chromium
      - name: Botu Calistir (${{ matrix.store }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_STORE_RUNTIME_SECONDS: '2700'
        run: python scraper.py ${{ matrix.store }}
