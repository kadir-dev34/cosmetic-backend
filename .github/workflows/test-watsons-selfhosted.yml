name: TEST - Watsons Self-Hosted
# Bu GECICI bir test dosyasidir. Mevcut "Gece Kozmetik Scraper" workflow'una
# dokunmaz, tamamen ayri ve bagimsiz calisir. Amac: Watsons'in ev IP'nizden
# (self-hosted runner) erisilebilir olup olmadigini test etmek.
# Test basarili olursa bu dosyayi silip ana workflow'a kalici olarak
# entegre ederiz. Basarisiz olursa bu dosyayi silip hicbir iz kalmaz.

on:
  workflow_dispatch:  # Sadece manuel "Run workflow" ile calisir, otomatik tetiklenmez

jobs:
  test-watsons:
    # "self-hosted" etiketi, bu isin GitHub'in bulut sunucusu yerine
    # SIZIN bilgisayarinizda (kurdugunuz runner uzerinde) calismasini saglar.
    runs-on: self-hosted
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4 python-dotenv supabase
      - name: Watsons'i Test Et
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scraper.py watsons
